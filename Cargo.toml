[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "sdktrader"
version = "0.1.0"
edition = "2021"
authors = ["suenot"]
description = "High-performance Rust SDK for cryptocurrency trading across multiple exchanges"
license = "MIT"
repository = "https://github.com/suenot/sdktrader"
keywords = ["trading", "cryptocurrency", "sdk", "exchange", "api"]
categories = ["finance", "api-bindings"]
readme = "README.md"

[features]
default = ["full"]

# All available exchanges
full = ["bybit", "bingx", "binance", "gate", "okx", "bitget", "mexc", "hyperliquid", "kraken", "kucoin", "deribit", "phemex", "xt", "htx", "bitfinex", "bitmart", "coinex", "lbank", "weex", "ourbit"]

# Individual exchanges — propagate to sdktrader-providers features
bybit = ["sdktrader-providers/bybit"]
bingx = ["sdktrader-providers/bingx"]
binance = ["sdktrader-providers/binance"]
gate = ["sdktrader-providers/gate"]
okx = ["sdktrader-providers/okx"]
bitget = ["sdktrader-providers/bitget"]
mexc = ["sdktrader-providers/mexc"]
hyperliquid = ["sdktrader-providers/hyperliquid"]
kraken = ["sdktrader-providers/kraken"]
kucoin = ["sdktrader-providers/kucoin"]
deribit = ["sdktrader-providers/deribit"]
phemex = ["sdktrader-providers/phemex"]
xt = ["sdktrader-providers/xt"]
htx = ["sdktrader-providers/htx"]
bitfinex = ["sdktrader-providers/bitfinex"]
bitmart = ["sdktrader-providers/bitmart"]
coinex = ["sdktrader-providers/coinex"]
lbank = ["sdktrader-providers/lbank"]
weex = ["sdktrader-providers/weex"]
ourbit = ["sdktrader-providers/ourbit"]

# Optional features
storage = ["dep:sdktrader-storage"]
notifications = ["dep:sdktrader-notifications"]
utils = ["dep:sdktrader-utils"]
trading = ["dep:sdktrader-trading"]
signal = ["dep:sdktrader-signal"]
monitoring = ["dep:sdktrader-monitoring"]
proxy = ["dep:sdktrader-proxy"]
warming = ["dep:sdktrader-warming"]
price-cache = ["dep:sdktrader-price-cache"]
leverage-cache = ["dep:sdktrader-leverage-cache"]

# Testing features
integration = []
live = ["integration"]

# HTTP API server
api = ["dep:sdktrader-api", "dep:tracing-subscriber"]

[dependencies]
# Workspace crates
sdktrader-core = { path = "crates/sdktrader-core" }
sdktrader-providers = { path = "crates/sdktrader-providers", default-features = false }
sdktrader-utils = { path = "crates/sdktrader-utils", optional = true }
sdktrader-storage = { path = "crates/sdktrader-storage", optional = true }
sdktrader-notifications = { path = "crates/sdktrader-notifications", optional = true }
sdktrader-api = { path = "crates/sdktrader-api", optional = true }
sdktrader-trading = { path = "crates/sdktrader-trading", optional = true }
sdktrader-signal = { path = "crates/sdktrader-signal", optional = true }
sdktrader-monitoring = { path = "crates/sdktrader-monitoring", optional = true }
sdktrader-proxy = { path = "crates/sdktrader-proxy", optional = true }
sdktrader-warming = { path = "crates/sdktrader-warming", optional = true }
sdktrader-price-cache = { path = "crates/sdktrader-price-cache", optional = true }
sdktrader-leverage-cache = { path = "crates/sdktrader-leverage-cache", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Tracing subscriber (optional, for API server)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
