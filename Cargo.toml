[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "tradersdk"
version = "0.1.0"
edition = "2021"
authors = ["suenot"]
description = "High-performance Rust SDK for cryptocurrency trading across multiple exchanges"
license = "MIT"
repository = "https://github.com/suenot/tradersdk"
homepage = "https://tradersdk.com"
keywords = ["trading", "cryptocurrency", "sdk", "exchange", "api"]
categories = ["finance", "api-bindings"]
readme = "README.md"

[features]
default = ["full"]

# All available exchanges
full = ["bybit", "bingx", "binance", "gate", "okx", "bitget", "mexc", "hyperliquid", "kraken", "kucoin", "deribit", "phemex", "xt", "htx", "bitfinex", "bitmart", "coinex", "lbank", "weex", "ourbit"]

# Individual exchanges — propagate to tradersdk-providers features
bybit = ["tradersdk-providers/bybit"]
bingx = ["tradersdk-providers/bingx"]
binance = ["tradersdk-providers/binance"]
gate = ["tradersdk-providers/gate"]
okx = ["tradersdk-providers/okx"]
bitget = ["tradersdk-providers/bitget"]
mexc = ["tradersdk-providers/mexc"]
hyperliquid = ["tradersdk-providers/hyperliquid"]
kraken = ["tradersdk-providers/kraken"]
kucoin = ["tradersdk-providers/kucoin"]
deribit = ["tradersdk-providers/deribit"]
phemex = ["tradersdk-providers/phemex"]
xt = ["tradersdk-providers/xt"]
htx = ["tradersdk-providers/htx"]
bitfinex = ["tradersdk-providers/bitfinex"]
bitmart = ["tradersdk-providers/bitmart"]
coinex = ["tradersdk-providers/coinex"]
lbank = ["tradersdk-providers/lbank"]
weex = ["tradersdk-providers/weex"]
ourbit = ["tradersdk-providers/ourbit"]

# Optional features
storage = ["dep:tradersdk-storage"]
notifications = ["dep:tradersdk-notifications"]
utils = ["dep:tradersdk-utils"]
trading = ["dep:tradersdk-trading"]
signal = ["dep:tradersdk-signal"]
monitoring = ["dep:tradersdk-monitoring"]
proxy = ["dep:tradersdk-proxy"]
warming = ["dep:tradersdk-warming"]
price-cache = ["dep:tradersdk-price-cache"]
leverage-cache = ["dep:tradersdk-leverage-cache"]

# Testing features
integration = []
live = ["integration"]

# HTTP API server
api = ["dep:tradersdk-api", "dep:tracing-subscriber"]

[dependencies]
# Workspace crates
tradersdk-core = { path = "crates/tradersdk-core" }
tradersdk-providers = { path = "crates/tradersdk-providers", default-features = false }
tradersdk-utils = { path = "crates/tradersdk-utils", optional = true }
tradersdk-storage = { path = "crates/tradersdk-storage", optional = true }
tradersdk-notifications = { path = "crates/tradersdk-notifications", optional = true }
tradersdk-api = { path = "crates/tradersdk-api", optional = true }
tradersdk-trading = { path = "crates/tradersdk-trading", optional = true }
tradersdk-signal = { path = "crates/tradersdk-signal", optional = true }
tradersdk-monitoring = { path = "crates/tradersdk-monitoring", optional = true }
tradersdk-proxy = { path = "crates/tradersdk-proxy", optional = true }
tradersdk-warming = { path = "crates/tradersdk-warming", optional = true }
tradersdk-price-cache = { path = "crates/tradersdk-price-cache", optional = true }
tradersdk-leverage-cache = { path = "crates/tradersdk-leverage-cache", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Tracing subscriber (optional, for API server)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
