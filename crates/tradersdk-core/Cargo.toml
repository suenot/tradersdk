[package]
name = "tradersdk-core"
version = "0.1.0"
edition = "2021"
description = "Core types, traits, and utilities for tradersdk exchange adapters"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.35", features = ["sync", "time"] }
rust_decimal = { version = "1.33", features = ["serde", "serde-with-str"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4"] }
reqwest = { version = "0.11" }
schemars = { version = "0.8", features = ["derive"], optional = true }

[features]
default = []
json-schema = ["schemars"]
