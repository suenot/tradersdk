[package]
name = "tradersdk-schema-export"
version = "0.1.0"
edition = "2021"
description = "Exports JSON Schema from tradersdk-core types"
publish = false

[[bin]]
name = "schema-export"
path = "src/main.rs"

[dependencies]
tradersdk-core = { path = "../tradersdk-core", features = ["json-schema"] }
schemars = "0.8"
serde_json = "1.0"
