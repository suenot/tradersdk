[package]
name = "sdktrader-notifications"
version = "0.1.0"
edition = "2021"
description = "Notification system for sdktrader — Telegram, webhook"

[dependencies]
sdktrader-core = { path = "../sdktrader-core" }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.35", features = ["time"] }
