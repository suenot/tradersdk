[package]
name = "sdktrader-ourbit"
version = "0.1.0"
edition = "2021"
description = "Ourbit exchange adapter for sdktrader"

[dependencies]
sdktrader-core = { path = "../sdktrader-core" }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
tracing = "0.1"
