[package]
name = "sdktrader-api"
version = "0.1.0"
edition = "2021"
description = "HTTP API server for sdktrader — exchange adapter testing"

[[bin]]
name = "sdktrader-api"
path = "src/main.rs"

[dependencies]
sdktrader-core = { path = "../sdktrader-core" }
sdktrader-providers = { path = "../sdktrader-providers" }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
