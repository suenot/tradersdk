[package]
name = "sdktrader-providers"
version = "0.1.0"
edition = "2021"
authors = ["suenot"]
description = "Exchange provider registry for sdktrader — feature-gated re-exports of all exchange crates"
license = "MIT"
repository = "https://github.com/suenot/sdktrader_rs"

[features]
default = ["full"]

# All available exchanges
full = ["bybit", "bingx", "binance", "gate", "okx", "bitget", "mexc", "hyperliquid", "kraken", "kucoin", "deribit", "phemex", "xt", "htx", "bitfinex", "bitmart", "coinex", "lbank", "weex", "ourbit"]

# Individual exchanges (add new exchange crates here)
bybit = ["dep:sdktrader-bybit"]
bingx = ["dep:sdktrader-bingx"]
binance = ["dep:sdktrader-binance"]
gate = ["dep:sdktrader-gate"]
okx = ["dep:sdktrader-okx"]
bitget = ["dep:sdktrader-bitget"]
mexc = ["dep:sdktrader-mexc"]
hyperliquid = ["dep:sdktrader-hyperliquid"]
kraken = ["dep:sdktrader-kraken"]
kucoin = ["dep:sdktrader-kucoin"]
deribit = ["dep:sdktrader-deribit"]
phemex = ["dep:sdktrader-phemex"]
xt = ["dep:sdktrader-xt"]
htx = ["dep:sdktrader-htx"]
bitfinex = ["dep:sdktrader-bitfinex"]
bitmart = ["dep:sdktrader-bitmart"]
coinex = ["dep:sdktrader-coinex"]
lbank = ["dep:sdktrader-lbank"]
weex = ["dep:sdktrader-weex"]
ourbit = ["dep:sdktrader-ourbit"]

[dependencies]
sdktrader-core = { path = "../sdktrader-core" }
sdktrader-bybit = { path = "../sdktrader-bybit", optional = true }
sdktrader-bingx = { path = "../sdktrader-bingx", optional = true }
sdktrader-binance = { path = "../sdktrader-binance", optional = true }
sdktrader-gate = { path = "../sdktrader-gate", optional = true }
sdktrader-okx = { path = "../sdktrader-okx", optional = true }
sdktrader-bitget = { path = "../sdktrader-bitget", optional = true }
sdktrader-mexc = { path = "../sdktrader-mexc", optional = true }
sdktrader-hyperliquid = { path = "../sdktrader-hyperliquid", optional = true }
sdktrader-kraken = { path = "../sdktrader-kraken", optional = true }
sdktrader-kucoin = { path = "../sdktrader-kucoin", optional = true }
sdktrader-deribit = { path = "../sdktrader-deribit", optional = true }
sdktrader-phemex = { path = "../sdktrader-phemex", optional = true }
sdktrader-xt = { path = "../sdktrader-xt", optional = true }
sdktrader-htx = { path = "../sdktrader-htx", optional = true }
sdktrader-bitfinex = { path = "../sdktrader-bitfinex", optional = true }
sdktrader-bitmart = { path = "../sdktrader-bitmart", optional = true }
sdktrader-coinex = { path = "../sdktrader-coinex", optional = true }
sdktrader-lbank = { path = "../sdktrader-lbank", optional = true }
sdktrader-weex = { path = "../sdktrader-weex", optional = true }
sdktrader-ourbit = { path = "../sdktrader-ourbit", optional = true }
anyhow = "1.0"
