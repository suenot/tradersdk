[package]
name = "sdktrader-proxy"
version = "0.1.0"
edition = "2021"
description = "Proxy rotation with cooldown and parallel request scheduling"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.8"
tokio = { version = "1.35", features = ["time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
