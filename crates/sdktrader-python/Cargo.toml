[package]
name = "sdktrader-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for sdktrader via PyO3"

[lib]
name = "sdktrader_rs"
crate-type = ["cdylib"]

[dependencies]
# PyO3 bindings
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

# Workspace crates
sdktrader-core = { path = "../sdktrader-core" }
sdktrader-providers = { path = "../sdktrader-providers", features = ["full"] }

# Runtime
tokio = { version = "1", features = ["full"] }

# Serialization for Python dict conversion
serde = "1.0"
pythonize = "0.29"
