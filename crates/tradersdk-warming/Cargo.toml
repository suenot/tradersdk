[package]
name = "tradersdk-warming"
version = "0.1.0"
edition = "2021"
description = "Connection warming: server time queries with circuit breaker, account detection"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["time", "sync"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
