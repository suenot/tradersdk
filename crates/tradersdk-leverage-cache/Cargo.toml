[package]
name = "tradersdk-leverage-cache"
version = "0.1.0"
edition = "2021"
description = "Leverage cache: JSON file-based max leverage lookup per symbol/exchange"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["time", "sync", "fs"] }
tracing = "0.1"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
tempfile = "3"
