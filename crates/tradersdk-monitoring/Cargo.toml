[package]
name = "tradersdk-monitoring"
version = "0.1.0"
edition = "2021"
description = "Detects markets added to or removed from an exchange by diffing snapshots"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
