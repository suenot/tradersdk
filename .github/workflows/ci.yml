name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # dead_code is allowed: exchange adapters carry helpers and response
      # fields for endpoints that are wired up but not yet called.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead_code

      - name: Test
        run: cargo test --workspace

  minimal-features:
    name: single-exchange build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The point of the feature flags is that one exchange compiles alone.
      - name: Build with only bybit
        run: cargo check -p sdktrader --no-default-features --features bybit
